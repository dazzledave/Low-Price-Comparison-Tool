services:
  - type: web
    name: pic2price-app
    env: python
    plan: free
    buildCommand: pip install -r requirements_render.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production 